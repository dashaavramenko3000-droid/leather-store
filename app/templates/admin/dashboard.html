{% extends 'admin/base.html' %}
{% block title %}Панель управления{% endblock %}
{% block content %}
<h2>Панель управления</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
    <div class="stat-card">
        <h3>Товары</h3>
        <p>{{ product_count }}</p>
    </div>
    <div class="stat-card">
        <h3>Заказы</h3>
        <p>{{ order_count }}</p>
    </div>
</div>
{% endblock %}
