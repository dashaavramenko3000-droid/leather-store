{% extends 'admin/base.html' %}

{% block title %}Настройки сайта{% endblock %}

{% block content %}
<h2>Настройки сайта</h2>
<form method="POST">
    <!-- CSRF-токен -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" name="show_promo_code_field" id="show_promo_code_field"
               {% if show_promo == 'true' %}checked{% endif %}>
        <label class="form-check-label" for="show_promo_code_field">Показывать поле промокода в корзине</label>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Сохранить</button>
</form>
{% endblock %}
