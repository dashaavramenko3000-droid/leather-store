<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кожаная мастерская «Тиснение»{% endblock %}</title>
    <!-- Подключаем Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <div class="logo">
            <a href="/">Кожаная мастерская<br><span>«Тиснение»</span></a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="{{ url_for('catalog') }}">Наши изделия</a></li>
                <li><a href="{{ url_for('home') }}#about">О нас</a></li>
                <li><a href="{{ url_for('home') }}#contacts">Контакты</a></li>
            </ul>
        </nav>
        <div class="header-contacts">
            <a href="tel:+79991234567">+7 (999) 123-45-67</a>
        </div>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <p>© 2026 Кожаная мастерская «AvramenkaDa». Все права защищены.</p>
        <p>Изделия из натуральной кожи ручной работы с тиснением.</p>
    </div>
</footer>

<button id="scrollToTopBtn" title="Наверх">↑</button>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        duration: 800,        // длительность анимации в мс
        easing: 'ease-in-out', // плавность
        once: true            // анимация выполняется только один раз
    });
</script>
</body>
</html>
