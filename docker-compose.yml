version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://leather_user:strong_password@db/leather_store
      - REDIS_HOST=redis
      - SECRET_KEY=your_secret_key
    depends_on:
      - db
      - redis
    volumes:
      - ./static/uploads:/app/static/uploads

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: leather_store
      MYSQL_USER: leather_user
      MYSQL_PASSWORD: strong_password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data: